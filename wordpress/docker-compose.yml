services:
  # SERVICE 1: MariaDB database
  db:
    image: mariadb:10.6.4-focal       # official MariaDB image
    container_name: wordpress_db
    restart: unless-stopped
    env_file:
      - .env                          # secrets loaded from .env (never commit this to Git)
    volumes:
      - db_data:/var/lib/mysql        # named volume: persistent data
    networks:
      - internal                      # internal-only network
    # IMPORTANT: no ports -> MariaDB is not accessible from the outside

  # SERVICE 2: WordPress
  wordpress:
    image: wordpress:latest
    container_name: wordpress_app
    restart: unless-stopped
    env_file:
      - .env                          # secrets loaded from .env
    environment:
      WORDPRESS_DB_HOST: db:3306      # 'db' = MariaDB service name
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - internal                      # internal-only network
    # IMPORTANT: no ports -> WordPress is not directly accessible

  # SERVICE 3: NGINX Proxy Manager (reverse proxy)
  npm:
    image: jc21/nginx-proxy-manager:2.11.3
    container_name: nginx_proxy_manager
    restart: unless-stopped
    ports:
      - "80:80"     # public HTTP traffic
      - "81:81"     # NPM admin panel
      - "443:443"   # public HTTPS traffic
    volumes:
      - npm_data:/data                # persistent NPM configuration
      - npm_letsencrypt:/etc/letsencrypt # persistent SSL certificates
    networks:
      - internal    # communicates with WordPress (internal network)
      - external    # exposed to the internet (external network)
    # NPM is the ONLY entry point visible from the outside

# NAMED VOLUMES: data persists even if containers are removed
volumes:
  db_data:           # MySQL data
  npm_data:          # NPM configuration
  npm_letsencrypt:   # SSL certificates

# NETWORKS: layered isolation
networks:
  internal:
    driver: bridge   # private network: db + wordpress + npm
  external:
    driver: bridge   # public network: npm only

# Note:
# Resulting network flow: Internet → NPM :80/:443 → wordpress_app:80 → db:3306
#                                   (external)      (internal)      (internal)
# MariaDB is never exposed. WordPress is never exposed. Only NPM is visible from the outside — the core principle of a reverse proxy.
