# Declares the services section — each service is a container. It’s always the first key in the compose file
services:

  # Service name. Docker will create a container called node-app. You choose the name — it could be anything
  node-app:
    
    # Instead of pulling a ready-made image from Docker Hub (image: nginx), Docker will build the image from the Dockerfile in the current directory (. = here). It’s equivalent to running docker build . manually
    build: .
    
    # Fixed name for the container. Without this, Docker would generate a random name like focused_khorana
    container_name: devops-node-app
    
    # Restart policy — if the container crashes due to an error, Docker automatically restarts it. It only stops when you explicitly run docker compose down
    restart: unless-stopped
    
    # Port mapping — port 3000 on your Mac mapped to port 3000 inside the container. Without this, the app runs but isn’t accessible from the browser
    ports:
      - "3000:3000"
    
    # Environment variable injected into the container at runtime. app.js reads process.env.PORT to know which port to listen on. It reinforces what’s already in .env but makes it explicit in the compose file
    environment:
      PORT: 3000
